spring.application.name=plazoleta-mensajeria
server.port=${SERVER_PORT:8082}
# Carga opcional de un archivo .env local (copie .env.example a .env). Las variables de
# entorno del sistema siempre tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Token para las rutas /internal/** entre microservicios (el mismo de usuarios y restaurantes).
app.internal.token=${USERS_INTERNAL_TOKEN}

# Proveedor de SMS: "simulated" escribe el mensaje en la consola; "twilio" lo envía de verdad;
# "twilio-plantilla" envía con Twilio la plantilla TWILIO_TEMPLATE (cuentas Trial) y escribe el mensaje real en la consola.
app.sms.provider=${SMS_PROVIDER:simulated}
app.sms.twilio.base-url=${TWILIO_BASE_URL:https://api.twilio.com}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.sms.twilio.template=${TWILIO_TEMPLATE:sms_2fa}
# Tiempo máximo para conectar con Twilio y para que responda (502 si se cumple).
app.sms.twilio.connect-timeout=${TWILIO_CONNECT_TIMEOUT:2s}
app.sms.twilio.read-timeout=${TWILIO_READ_TIMEOUT:10s}
